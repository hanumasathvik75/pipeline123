name: CI — Lint & Validate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-desktop:
    name: 🐍 Python Lint (Desktop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install pyflakes

      - name: Run Pyflakes (syntax & import check)
        run: |
          cd desktop
          # Check all Python files for syntax errors and undefined names
          python -m pyflakes app/ || true

      - name: Validate config.py is NOT committed with real key
        run: |
          if [ -f desktop/app/config.py ]; then
            if grep -q "AIzaSy" desktop/app/config.py; then
              echo "❌ ERROR: Real Gemini API key found in config.py!"
              echo "   Remove it before pushing. Use config.example.py as template."
              exit 1
            fi
          fi
          echo "✅ No API key leak detected."

      - name: Check Python imports resolve
        run: |
          cd desktop
          python -c "
          import sys
          sys.path.insert(0, '.')
          # Patch config to avoid key requirement
          import types
          cfg = types.ModuleType('app.config')
          cfg.GEMINI_API_KEY = 'test'
          cfg.GEMINI_MODEL_NAME = 'gemini-1.5-flash-latest'
          cfg.APP_NAME = 'IgnitionAI'
          cfg.APP_VERSION = '1.0.0'
          cfg.APP_SUBTITLE = 'AI Diagnostics'
          for color_attr in ['COLOR_BG_DARKEST','COLOR_BG_DARK','COLOR_BG_PANEL','COLOR_BG_CARD',
            'COLOR_SIDEBAR','COLOR_ACCENT_BLUE','COLOR_LIGHT_BLUE','COLOR_LIGHTER_BLUE','COLOR_CYAN',
            'COLOR_CYAN_DIM','COLOR_TEXT_PRIMARY','COLOR_TEXT_SECONDARY','COLOR_TEXT_MUTED',
            'COLOR_SUCCESS','COLOR_WARNING','COLOR_DANGER','COLOR_INFO','COLOR_BORDER','COLOR_HOVER',
            'SEVERITY_CRITICAL','SEVERITY_HIGH','SEVERITY_MEDIUM','SEVERITY_LOW']:
            setattr(cfg, color_attr, '#000000')
          sys.modules['app.config'] = cfg
          sys.modules['app'] = types.ModuleType('app')
          from app.data.dtc_database import obd2_dtc_diagnostic_database, dtc_root_cause_repairs
          from app.data.simulator import get_scenario_names, simulate_scan
          from app.engine.diagnostic import run_full_analysis
          print('✅ All core modules import successfully')
          dtcs, sensors, _ = simulate_scan(get_scenario_names()[0])
          result = run_full_analysis(dtcs, sensors)
          assert result['final_root'], 'Pipeline returned empty root cause'
          print(f'✅ Pipeline test passed: {result[\"final_root\"]} ({result[\"final_decision\"][\"confidence\"]*100:.0f}% confidence)')
          " || true

  check-secrets:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for accidentally committed secrets
        run: |
          # Check for common API key patterns
          if grep -rn "AIzaSy" --include="*.py" . 2>/dev/null | grep -v "config.example"; then
            echo "❌ Possible Google API key found in Python files!"
            exit 1
          fi
          echo "✅ Secret scan clean."
