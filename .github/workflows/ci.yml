name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy .

    - name: Test with pytest
      run: |
        pytest tests/ --cov=training --cov=knowledge_graph --cov-fail-under=80

    - name: Validate domain knowledge graph schemas
      run: |
        # Placeholder for validation script that we will write in Phase 1
        # python -m data_gen.schemas.validate_graph
        echo "Validation script placeholder"
