plugins { id 'application' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies { implementation project(':native-core') }
application { mainClass = 'com.ignitionai.desktop.IgnitionDesktop' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('jar') {
    archiveFileName = 'ignitionai-desktop.jar'
    manifest { attributes 'Main-Class': application.mainClass.get(), 'Class-Path': 'native-core.jar' }
}
