version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ignitionai
      POSTGRES_USER: ignitionai
      POSTGRES_PASSWORD: ignitionai_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignitionai -d ignitionai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./serving
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://ignitionai:ignitionai_local_only@postgres:5432/ignitionai
    depends_on:
      - mlflow
      - postgres

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mlflow_data:
  minio_data:
