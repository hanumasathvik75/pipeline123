[project]
name = "ignitionai-universal"
version = "0.1.0"
description = "Cross-system AI diagnostic assistant covering every major vehicle subsystem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pgmpy>=0.1.25",
    "lightgbm>=4.4.0",
    "mlflow>=2.14.0",
    "dvc[s3]>=3.51.2",
    "hydra-core>=1.3.2",
    "pydantic-settings>=2.3.4",
    "pydantic>=2.8.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black/ruff formatter
]

[tool.pytest.ini_options]
addopts = "--cov=training --cov=knowledge_graph --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
