server.port=8080
spring.application.name=IgnitionAI-Gateway-Backend

# ML FastAPI Microservice Configuration
ml.service.url=http://127.0.0.1:8000
ml.service.connect-timeout-ms=5000
ml.service.read-timeout-ms=30000

# Logging Configuration
logging.level.ai.ignition.spring=INFO
logging.level.org.springframework.web=INFO

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
