plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
def modules = ['application','anomaly-monitoring','bms-diagnostics','certificate-snapshot','certificate-validation','consistency-checks',
    'degradation-evidence-store','degradation-feature-builder','degradation-state-estimator','direct-features',
    'episode-store','event-risk-estimator','evidence-store','expected-behaviour-model','fact-extraction',
    'health-evidence','latex-certificate-generator','linked-registries','obd-input-and-pre-processing','obd-input-contract',
    'phase4-contract','phase5-contract','phase6-contract','residual-calculation','severity-indicator',
    'subsystem-health-score','technical-sources','trend-and-persistence-analyzer','uncertainty-calculation',
    'vehicle-context','vehicle-health-index','virtual-sensors','tools/obd-generator','tools/pipeline-runner']
sourceSets.main.java {
    // Falls back through src/main/java, then plain src, then the module's own root -- the last
    // covers tools/pipeline-runner, whose .java files sit directly in the module directory with no
    // src subfolder at all.
    setSrcDirs(modules.collect { m ->
        def mainJava = rootProject.file(m + '/src/main/java')
        def plainSrc = rootProject.file(m + '/src')
        mainJava.exists() ? mainJava : (plainSrc.exists() ? plainSrc : rootProject.file(m))
    })
    exclude '**/*Test*.java', '**/Phase6Fixtures.java'
}
sourceSets.main.resources {
    setSrcDirs(modules.findAll { rootProject.file(it + '/src/main/resources').exists() }.collect { rootProject.file(it + '/src/main/resources') })
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
