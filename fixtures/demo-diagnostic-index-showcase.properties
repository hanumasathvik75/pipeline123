# Demo scenario for the IgnitionAI Diagnostic Index (virtual-sensor) showcase.
# Load via the standalone Simulator tool, then open the saved session in the assessment app.
# Two idle/cruise cycles, ~5 minutes. P0301 (cylinder 1 misfire) is set active for the last 50s of
# the drive so it survives to the final DTC scan -- InspectionService rebuilds its DTC set from
# scratch on every COMPLETE scan, so a code only "active" earlier in the drive (fault window ending
# before the session does) legitimately disappears by the final certificate scan, same as a real
# re-scan would show once the condition clears. That's a real, separate finding worth its own fix
# later (see the fix-everything plan) -- for this demo, the fault window is placed so P0301 is
# genuinely still present at the end. It pairs with the Combustion index's misfire-like finding
# below: the DTC alone says "cylinder 1 misfire"; the Diagnostic Index explains the pattern behind
# it and adds four more findings a DTC scan alone would never surface.
vehicle=SIM-DEMO-01
start_time=2026-09-19T09:00:00Z
duration_ms=300000
seed=2026
scenario=CITY_DRIVING
missing_fraction=0.01
fault_start_ms=250000
fault_end_ms=300000
dtcs=P0301
signals=engine_rpm,vehicle_speed,coolant_temperature,calculated_engine_load,throttle_position,short_term_fuel_trim_b1,long_term_fuel_trim_b1,control_module_voltage,manifold_absolute_pressure,mass_airflow_rate,timing_advance,oil_temperature,intake_air_temperature,barometric_pressure,ambient_air_temperature,fuel_rate_lph,accelerator_pedal_position,commanded_throttle_position,short_term_fuel_trim_b2,long_term_fuel_trim_b2,fuel_level,o2_bank1_sensor2_voltage,o2_bank1_sensor2_stft

