# Wave-2 narrow slice (§3.4 of the fix-everything plan): raw PIDs added with no new statistical
# logic. Oil runs a little hotter than coolant at steady state once warm, hence the small positive
# gap fed to OilMinusCoolantFeature; intake air temp and barometric pressure are near-constant for
# a short single-city drive so they exist mainly to prove the signal is captured end to end.
