# Comprehensive-suite scenario 5 of 7: combustion fault + charging fault + a corroborating DTC
# together, to stress the Probabilistic Fault Graph's evidence compounding across independent
# sources. Expected: Combustion FLAGGED, Charging FLAGGED, P0301 present, Fault Graph shows
# spark-plug/ignition-coil candidates with a probability higher than either the index or DTC alone
# would give (see FaultCandidateRanker's own verified compounding behaviour).
